[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Enforce canonical domain — redirect Netlify subdomain to custom domain
# Replace "your-site-name" below with your actual Netlify site name after deploying
